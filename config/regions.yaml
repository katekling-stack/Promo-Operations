regions:
  # `timezone` is the FreeWheel placement-schedule time zone for the market. FreeWheel only
  # accepts a curated set of representative-city strings (validated live via create-placement);
  # where FW has no local city, the same-offset valid string is used (offset is what drives
  # delivery). Confirmed-valid: America - New York, America - Chicago, Europe - London,
  # Europe - Amsterdam (CET), Europe - Helsinki (EET), Australia - Melbourne (AEST),
  # America - Buenos Aires, Argentina (GMT-3). (São Paulo/Sydney/Rome/Dublin are NOT in FW's list.)
  USA:
    name: United States
    code: US
    domestic: true
    tier1_eligible: true
    countries:
    - United States
    has_pluto: true
    timezone: "(GMT-05:00) America - New York"          # Eastern
    # Flight start clock time in the market TZ. USA starts at 3:00 AM ET (= 12:00 AM PT) so
    # a campaign goes live from the West Coast eastward on the selected date, regardless of
    # which coast. Other markets default to 00:00 (midnight local).
    flight_start_time: "03:00"
  CA:
    name: Canada
    code: CA
    tier1_eligible: true
    countries:
    - Canada
    has_pluto: true
    timezone: "(GMT-05:00) America - New York"          # Eastern (Toronto)
  AU:
    name: Australia
    code: AU
    tier1_eligible: true
    countries:
    - Australia
    has_pluto: false
    timezone: "(GMT+10:00) Australia - Melbourne"        # AEST
  LATAM:
    name: Latin America
    code: LATAM
    tier1_eligible: true
    # LATAM targets a single FreeWheel geography REGION grouping (not per-country).
    geo_region: '1069'
    countries:
    - Mexico
    - Argentina
    - Chile
    - Colombia
    - Peru
    - Brazil
    has_pluto: true
    timezone: "(GMT-03:00) America - Buenos Aires, Argentina"
  BR:
    name: Brazil
    code: BR
    tier1_eligible: true
    countries:
    - Brazil
    has_pluto: true
    timezone: "(GMT-03:00) America - Buenos Aires, Argentina"   # GMT-3 (FW has no São Paulo)
  UK:
    name: United Kingdom
    code: UK
    tier1_eligible: true
    countries:
    - United Kingdom
    has_pluto: true
    timezone: "(GMT+00:00) Europe - London"
  IE:
    name: Ireland
    code: IE
    tier1_eligible: true
    has_pluto: false
    countries:
    - Ireland
    timezone: "(GMT+00:00) Europe - London"             # GMT (FW has no Dublin)

  FR:
    name: France
    code: FR
    tier1_eligible: true
    has_pluto: true
    countries:
    - France
    timezone: "(GMT+01:00) Europe - Amsterdam"          # CET
  IT:
    name: Italy
    code: IT
    tier1_eligible: true
    has_pluto: true
    countries:
    - Italy
    timezone: "(GMT+01:00) Europe - Amsterdam"          # CET (FW has no Rome)
  GSA:
    name: Germany / Switzerland / Austria
    code: GSA
    tier1_eligible: true
    has_pluto: true
    countries:
    - Germany
    - Switzerland
    - Austria
    timezone: "(GMT+01:00) Europe - Amsterdam"          # CET
  FI:
    name: Finland
    code: FI
    tier1_eligible: true
    has_pluto: true
    countries:
    - Finland
    timezone: "(GMT+02:00) Europe - Helsinki"           # EET
  DK:
    name: Denmark
    code: DK
    tier1_eligible: true
    has_pluto: true
    countries:
    - Denmark
    timezone: "(GMT+01:00) Europe - Amsterdam"          # CET
  'NO':
    name: Norway
    code: 'NO'
    tier1_eligible: true
    has_pluto: true
    countries:
    - Norway
    timezone: "(GMT+01:00) Europe - Amsterdam"          # CET
  SE:
    name: Sweden
    code: SE
    tier1_eligible: true
    has_pluto: true
    countries:
    - Sweden
    timezone: "(GMT+01:00) Europe - Amsterdam"          # CET
  ES:
    name: Spain
    code: ES
    tier1_eligible: true
    has_pluto: true
    countries:
    - Spain
    timezone: "(GMT+01:00) Europe - Amsterdam"          # CET
