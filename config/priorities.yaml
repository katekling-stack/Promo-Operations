# Per-placement priority levels + frequency caps.
#
# CONFIRMED from the "Global Digital O&O — Promo Settings Reference" sheet,
# tab "Tiered – Domestic" (US), for Paramount O&O + Pluto TV video and pause ads.
# https://docs.google.com/spreadsheets/d/1KJx7jHIVia7Xs5-_Lkug5fx6DF6C8NDDpYC49gh1mDU
#
# Priority is a NUMBER derived from (tier, duration bucket):
#   Tier 1 -> base 1, Tier 2 -> base 4, Tier 3 -> base 7  (+ duration offset)
#   duration offset: :30-:90 = 0, :15 = 1, :20/:10 = 2
#   Tier 4 -> 10 (all durations)
# e.g. Tier 1 :30 = 1, Tier 1 :15 = 2, Tier 2 :15 = 5, Tier 3 :20 = 9, Tier 4 = 10.

priority_base_by_tier:
  1: 1
  2: 4
  3: 7
tier4_priority: 10

# Pluto TV - {Region} campaigns run Tier 4 HOTTER for the main creative lengths: :15 and
# :30-and-above get priority 8 (not 10); shorter creatives (:5/:6/:10/:20) stay at 10.
# Non-Pluto campaigns keep the flat tier4_priority above. Verified against live
# "Pluto TV - {Region}" IOs.
pluto_tier4_priority:
  reduced: 8                       # :15 and :30+ Tier 4 lines
  default: 10                      # :5, :6, :10, :20 (and any other short creative)
  reduced_min_duration: 30         # :30 and longer
  reduced_extra_durations: [15]    # plus :15 specifically

# Duration buckets -> offset added to the tier base.
duration_offsets:
  "30": 0
  "45": 0
  "60": 0
  "90": 0
  "15": 1
  "20": 2
  "10": 2
default_duration_offset: 0

# Guaranteed formats (Premium Pre-Roll, Essential Bumper) run at sponsorship priority.
guaranteed_priority: "SPONSORSHIP"

# Frequency caps.
frequency_caps:
  by_tier:
    1: "1 per 30 min"
    2: "1 per 30 min"
    3: "1 per 30 min"
    4: "1 per hr"
  by_format:                       # guaranteed per-format caps (global)
    # Premium Plan Pre-Rolls: 1 per week. Essential/Basic Plan Bumpers: 1 per 2 hours.
    premium_preroll: "1 per week"           # FW period 10080 min
    essential_bumper: "1 per 2 hrs"         # FW period 120 min
    pplus_kids_premium_preroll: "1 per week"
    pplus_kids_essential_bumper: "1 per 2 hrs"
  default: "1 per 30 min"

# Creative duration priority order (deck): :30 > :45/:60 > :15 > :20/:10.
duration_priority: [30, 45, 60, 90, 15, 20, 10]
default_durations: [30, 15]
