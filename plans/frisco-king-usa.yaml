# Support plan for the Frisco King - USA promo campaign.
#
# This is the kickoff worked example. It is modeled on the FreeWheel campaign:
#   https://cbsi-mrm.freewheel.tv/app/520311/advertising/campaigns/86543608/?insertion_order_id=92725144
#
# The `advertiser`/`campaign` fields identify where the Order goes in FreeWheel.
# Anything left null is meant to be resolved live (from FreeWheel by VCBS name
# filter, or from the Salesforce Case) — see docs/ROADMAP.md.

promoted_title: "Frisco King"
region: USA
brand: paramount_plus_domestic     # drives ad units / main SGs / excludes (also derivable from campaign)

# Where this lands in FreeWheel: a new Insertion Order nested under an existing
# Campaign, under a specific Advertiser. Specify the exact Advertiser + Campaign.
advertiser:
  name: "VCBS English - USA - Adult (Promo)"   # verified live
  resolved_id: "1000520"          # verified live — exact advertiser id
campaign:
  name: "Paramount + - USA"       # EXISTING parent campaign the IO nests under
  resolved_id: "86543608"         # verified live (matches kickoff reference URL)
insertion_order_name: "Frisco King - USA"   # the new IO for this show/flight
brand_id: "346378"                # from reference IO 92725144
template_io_id: "92725144"        # model off IO 92725144 (Dutton Ranch - USA)

# FreeWheel "Recommended Show" Key Value — feeds Tier 1 carousel targeting and the
# Premium Pre-Roll / Essential recommended-show argument. Defaults to promoted_title.
recommended_show: "Frisco King"
# Excluded from EVERY placement so the show never promos against itself.
exclude_show: "Frisco King"

# Placement naming: "{title} - {season_or_messaging} - {duration} - Tier N - {region}".
season_or_messaging: "Season 1"
durations: [30, 15]               # video: one placement per tier x duration
# Guaranteed Premium/Essential placement id token. content_type: show | movie.
content_type: "show"
content_id: ""                    # ShowID (leave blank -> "[ShowID:]" to fill in)

# Salesforce Case that originated this plan (source of truth going forward).
salesforce_case: null

flight:
  start: "2026-10-01"             # placeholder (10/1/26) — update when confirmed
  end: "2026-12-31"               # placeholder (12/31/26)
  code: "L1"                      # launch beat / flight code, used in naming

# Formats to build. Each becomes one Placement per region.
# `tiers` overrides config/tiers.yaml format_tier_defaults when present.
formats:
  - remnant_video                 # full tier stack (1-4)
  - pause_ads                     # Tier 1 audience segments + Tiers 2 & 3
  - premium_preroll               # guaranteed P+ (existing order): genre + recommended show
  - essential_bumper              # guaranteed P+ (existing order): genre + recommended show

# ---------------------------------------------------------------------------
# Targeting inputs (from the support plan). The engine maps these onto tiers.
# ---------------------------------------------------------------------------

# Tier 1 audience = DDA only (GL-DDA-1P-), auto-resolved from the showlist.
# AAM segments (e.g. the old P+ "…Drama Fans" groupings) are SUNSET — never target them.
audience_segments: []

networks:
  - "Paramount Network"

genres:
  - Drama
  - Comedy
  - Crime
  - Western
  - War
  - Sports
  - "Action & Adventure"     # FreeWheel genre name (was "Action/Adventure")
  - News

