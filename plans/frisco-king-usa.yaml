# Support plan for the Frisco King - USA promo campaign.
#
# This is the kickoff worked example. It is modeled on the FreeWheel campaign:
#   https://cbsi-mrm.freewheel.tv/app/520311/advertising/campaigns/86543608/?insertion_order_id=92725144
#
# The `advertiser`/`campaign` fields identify where the Order goes in FreeWheel.
# Anything left null is meant to be resolved live (from FreeWheel by VCBS name
# filter, or from the Salesforce Case) — see docs/ROADMAP.md.

promoted_title: "Frisco King"
region: USA
brand: paramount_network          # -> config/brands.yaml

# Where this lands in FreeWheel. advertiser_name_contains narrows the VCBS list.
advertiser:
  name_contains: ["VCBS"]
  resolved_id: null               # filled at push time via freewheel.find_advertisers()
campaign:
  name: "Frisco King - USA"
  resolved_id: null
  clone_from_template: true       # clone structure from brand template_campaign_id

# Salesforce Case that originated this plan (source of truth going forward).
salesforce_case: null

flight:
  start: null                     # e.g. 2026-07-14
  end: null
  code: "L1"                      # launch beat / flight code, used in naming

# Formats to build. Each becomes one Placement per region.
# `tiers` overrides config/tiers.yaml format_tier_defaults when present.
formats:
  - remnant_video                 # full tier stack (1-4)
  - pause_ads                     # Tier 1 audience segments + Tiers 2 & 3

# ---------------------------------------------------------------------------
# Targeting inputs (from the support plan). The engine maps these onto tiers.
# ---------------------------------------------------------------------------

networks:
  - "Paramount Network"

genres:
  - Drama
  - Comedy
  - Crime
  - Western
  - War
  - Sports
  - "Action/Adventure"
  - News

# Content-affinity showlist. Drives Tier 2 (showlist) and Tier 1 (each resolved to
# a FreeWheel audience segment via the Audience Segments doc).
